# Webhook stays empty / placeholder until ALERT_WEBHOOK_URL is real.
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 2h

receivers:
  - name: default
    webhook_configs:
      - url: "http://host.docker.internal:9999/alert-drill"
        send_resolved: true
