<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 480" fill="none" role="img" aria-label="Fully Managed 24/7 Proactive Server Management and Security Shield">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="fmBaseGrad" x1="40" y1="20" x2="610" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EAF2ED" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F6F9F7" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="fmShieldGrad" x1="210" y1="70" x2="440" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3D8567"/>
      <stop offset="45%" stop-color="#265A44"/>
      <stop offset="100%" stop-color="#143225"/>
    </linearGradient>
    <linearGradient id="fmShieldCore" x1="260" y1="120" x2="390" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D6B52"/>
      <stop offset="100%" stop-color="#0E2319"/>
    </linearGradient>
    <linearGradient id="fmLimeGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4FF66"/>
      <stop offset="100%" stop-color="#AEE82C"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="fmShadowSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#152B23" flood-opacity="0.08"/>
    </filter>
    <filter id="fmShadowMd" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#152B23" flood-opacity="0.14"/>
    </filter>
    <filter id="fmShadowLg" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0E2019" flood-opacity="0.22"/>
    </filter>
    <filter id="fmNeonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Panel -->
  <g filter="url(#fmShadowSm)">
    <rect x="44" y="24" width="562" height="236" rx="20" fill="url(#fmBaseGrad)" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Dashboard Window Controls -->
    <circle cx="74" cy="48" r="5" fill="#E26D5C" opacity="0.85"/>
    <circle cx="92" cy="48" r="5" fill="#E8B949" opacity="0.85"/>
    <circle cx="110" cy="48" r="5" fill="#52B788" opacity="0.85"/>
    <text x="130" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#20372F" opacity="0.75">security-operations-center / 24-7-managed-fleet</text>
    <!-- Grid -->
    <path d="M44 70h562" stroke="#D3E2D8" stroke-width="1" stroke-opacity="0.6"/>
  </g>

  <!-- Hexagonal Forcefield Ambient Grid behind Shield -->
  <g stroke="#3D8567" stroke-width="1" stroke-opacity="0.2" fill="none" transform="translate(185, 60)">
    <polygon points="140,20 180,45 180,95 140,120 100,95 100,45"/>
    <polygon points="60,65 100,90 100,140 60,165 20,140 20,90"/>
    <polygon points="220,65 260,90 260,140 220,165 180,140 180,90"/>
    <polygon points="140,170 180,195 180,245 140,270 100,245 100,195"/>
    <circle cx="140" cy="70" r="2" fill="#C9FB50" opacity="0.6"/>
    <circle cx="60" cy="115" r="2" fill="#C9FB50" opacity="0.6"/>
    <circle cx="220" cy="115" r="2" fill="#C9FB50" opacity="0.6"/>
  </g>

  <!-- Central Multi-Layered Cyber Defense Shield -->
  <g transform="translate(205, 75)" filter="url(#fmShadowLg)">
    <!-- Outer Shield Bevel Rim -->
    <path d="M120 20 C 180 34, 216 48, 234 62 C 234 160, 185 220, 120 258 C 55 220, 6 160, 6 62 C 24 48, 60 34, 120 20 Z" fill="#204A39" stroke="#52A582" stroke-width="2"/>

    <!-- Inner Metallic Shield Plate -->
    <path d="M120 30 C 172 42, 204 55, 220 68 C 220 152, 176 206, 120 240 C 64 206, 20 152, 20 68 C 36 55, 68 42, 120 30 Z" fill="url(#fmShieldGrad)"/>

    <!-- Inner Recessed Armor Core -->
    <path d="M120 48 C 160 58, 186 68, 198 78 C 198 144, 162 188, 120 216 C 78 188, 42 144, 42 78 C 54 68, 80 58, 120 48 Z" fill="url(#fmShieldCore)" stroke="#3E7B62" stroke-width="1.2"/>

    <!-- Center Emblem: Cyber Fortress Lock & Checkmark -->
    <g transform="translate(120, 128)">
      <!-- Outer Rotating Orbital Ring -->
      <circle cx="0" cy="0" r="44" fill="#0C1B14" stroke="#52A582" stroke-width="1.5" stroke-dasharray="6 4"/>
      <circle cx="0" cy="0" r="34" fill="#1C3F31" stroke="#C9FB50" stroke-width="1"/>
      <!-- Glowing Verified Checkmark -->
      <path d="M-14 1 L-4 11 L16 -9" stroke="url(#fmLimeGlow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#fmNeonGlow)"/>
    </g>

    <!-- Top Laser Guide Accents -->
    <circle cx="120" cy="22" r="3.5" fill="#C9FB50"/>
    <line x1="70" y1="36" x2="170" y2="36" stroke="#C9FB50" stroke-width="1" stroke-opacity="0.4"/>
  </g>

  <!-- Top-Right Automated Patch & Security Updates Badge -->
  <g transform="translate(436, 42)" filter="url(#fmShadowMd)">
    <rect width="168" height="92" rx="16" fill="#FFFFFF" stroke="#DCE8E0" stroke-width="1.5"/>
    <!-- Cog / Patch Icon -->
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#18362A"/>
    <!-- Refresh / Update Arrows -->
    <path d="M26 24 a6 6 0 1 1 -2 4.5 M26 20 v5 h5" stroke="#C9FB50" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#20372F">Auto-Patching</text>
    <text x="56" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#3D8567">Kernel &amp; OS Hardening</text>

    <line x1="14" y1="58" x2="154" y2="58" stroke="#EBF2ED" stroke-width="1"/>

    <circle cx="22" cy="72" r="3" fill="#3D8567"/>
    <text x="32" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#5F7A6E">CVE ZERO-DAY SHIELD ACTIVE</text>
  </g>

  <!-- Bottom-Left Proactive Health & Telemetry Oscilloscope Card -->
  <g transform="translate(56, 296)" filter="url(#fmShadowMd)">
    <rect width="194" height="116" rx="16" fill="#152B23" stroke="#2B5646" stroke-width="1.5"/>
    <circle cx="22" cy="22" r="5" fill="#C9FB50"/>
    <text x="36" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Fleet Health Radar</text>
    <line x1="16" y1="38" x2="178" y2="38" stroke="#25473B" stroke-width="1"/>

    <text x="16" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#8EAF9F">REAL-TIME UPTIME</text>
    <text x="16" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#C9FB50">99.99%</text>

    <!-- Oscilloscope ECG / Pulse Waveform -->
    <path d="M16 96 L50 96 L60 84 L70 108 L80 92 L90 100 L100 96 L178 96" fill="none" stroke="#52B788" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="100" cy="96" r="3" fill="#C9FB50" filter="url(#fmNeonGlow)"/>
  </g>

  <!-- Bottom-Right 24/7 Expert Support Station Card -->
  <g transform="translate(416, 296)" filter="url(#fmShadowMd)">
    <rect width="186" height="116" rx="16" fill="#FFFFFF" stroke="#DCE8E0" stroke-width="1.5"/>
    <g transform="translate(18, 16)">
      <!-- Headset Icon -->
      <rect width="36" height="36" rx="10" fill="#1B3D30"/>
      <path d="M11 20 a7 7 0 0 1 14 0 v5 a2 2 0 0 1 -2 2 h-1 v-5 h2 v-2 a6 6 0 0 0 -12 0 v2 h2 v5 h-1 a2 2 0 0 1 -2 -2 Z" fill="#C9FB50"/>
      <path d="M21 27 v2 a3 3 0 0 1 -3 3 h-2" stroke="#C9FB50" stroke-width="1.5" fill="none"/>
    </g>
    <text x="64" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#20372F">24/7 Operations</text>
    <text x="64" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#5F7A6E">L3 Systems Engineers</text>

    <line x1="18" y1="64" x2="168" y2="64" stroke="#EBF2ED" stroke-width="1"/>

    <rect x="18" y="74" width="150" height="26" rx="6" fill="#E8F6EE"/>
    <circle cx="30" cy="87" r="3.5" fill="#3D8567"/>
    <text x="40" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#245F48">ACTIVE MONITORING &amp; SOS</text>
  </g>
</svg>
