<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" fill="none" role="img" aria-label="Animated visual of VPS server hosting, Windows hosting, and remote desktop hosting plan cards">
  <defs>
    <linearGradient id="background" x1="70" y1="0" x2="1080" y2="1200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F8F5"/>
      <stop offset="0.57" stop-color="#EAF2ED"/>
      <stop offset="1" stop-color="#D7E5DD"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(590 480) rotate(90) scale(630)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardFill" x1="0" y1="370" x2="0" y2="940" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8FBF9"/>
    </linearGradient>
    <linearGradient id="disc" x1="-80" y1="-90" x2="80" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F9F6"/><stop offset="1" stop-color="#DDECE3"/>
    </linearGradient>
    <linearGradient id="forest" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#2C6A52"/><stop offset="1" stop-color="#143527"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-25%" width="160%" height="165%">
      <feDropShadow dx="0" dy="17" stdDeviation="23" flood-color="#143527" flood-opacity=".12"/>
    </filter>
    <filter id="iconShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#143527" flood-opacity=".10"/>
    </filter>
    <filter id="hubGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <style>
      /* Timelines live in the SVG, so animations also work through an HTML img element. */
      @keyframes driftA {0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
      @keyframes driftB {0%,100%{transform:translateY(-7px)}50%{transform:translateY(2px)}}
      @keyframes driftC {0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
      @keyframes breathe {0%,100%{opacity:.33}50%{opacity:1}}
      @keyframes scan {0%{stroke-dashoffset:46}100%{stroke-dashoffset:0}}
      @keyframes ping {0%,100%{opacity:.22;transform:scale(.92)}50%{opacity:.75;transform:scale(1.08)}}
      @keyframes softPop {0%,100%{opacity:.62}50%{opacity:1}}
      @keyframes moveArrow {0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
      .card-a{animation:driftA 5.6s ease-in-out infinite}
      .card-b{animation:driftB 5.1s ease-in-out infinite}
      .card-c{animation:driftC 6.2s ease-in-out infinite}
      .data-line{stroke-dasharray:5 9;animation:scan 3.4s linear infinite}
      .activity{animation:breathe 2.4s ease-in-out infinite}
      .activity-late{animation:breathe 2.4s 1.1s ease-in-out infinite}
      .halo{transform-box:fill-box;transform-origin:center;animation:ping 4.2s ease-in-out infinite}
      .active-pane{animation:softPop 3s ease-in-out infinite}
      .arrow{animation:moveArrow 2.2s ease-in-out infinite}
      @media (prefers-reduced-motion:reduce){
        .card-a,.card-b,.card-c,.data-line,.activity,.activity-late,.halo,.active-pane,.arrow{animation:none!important}
      }
    </style>
  </defs>

  <!-- Grounded, open background; no decorative elements behind the readable symbols. -->
  <rect width="1200" height="1200" fill="url(#background)"/>
  <rect width="1200" height="1200" fill="url(#glow)"/>
  <ellipse cx="600" cy="957" rx="480" ry="78" fill="#143527" opacity=".055"/>
  <ellipse cx="600" cy="967" rx="380" ry="45" fill="#2C6A52" opacity=".055"/>

  <!-- Discreet cloud network anchor: all three products share the same infrastructure. -->
  <g stroke="#A2C1AF" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".72">
    <path d="M560 270 C515 329 285 306 247 375"/>
    <path d="M600 290 V374"/>
    <path d="M640 270 C685 329 915 306 953 375"/>
  </g>
  <g stroke="#2C6A52" stroke-width="2.8" stroke-linecap="round" fill="none" opacity=".83">
    <path class="data-line" d="M560 270 C515 329 285 306 247 375"/>
    <path class="data-line" d="M600 290 V374" style="animation-delay:-1.2s"/>
    <path class="data-line" d="M640 270 C685 329 915 306 953 375" style="animation-delay:-2.2s"/>
  </g>
  <circle cx="600" cy="220" r="83" fill="#2C6A52" opacity=".08" filter="url(#hubGlow)"/>
  <circle cx="600" cy="214" r="76" fill="#FFFFFF" stroke="#D9E8DE" stroke-width="2" filter="url(#iconShadow)"/>
  <circle cx="600" cy="214" r="61" fill="#EAF2ED"/>
  <circle class="halo" cx="600" cy="214" r="52" stroke="#2C6A52" stroke-width="1.6" stroke-dasharray="2 10" opacity=".3"/>
  <path d="M570 230 C557 230 549 222 549 211 C549 199 559 189 572 190 C579 172 599 167 614 178 C621 174 632 175 637 182 C652 183 659 194 659 206 C659 220 648 230 635 230 Z"
        fill="#FFFFFF" stroke="#143527" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M585 210 H615" stroke="#2C6A52" stroke-width="5" stroke-linecap="round"/>
  <circle class="activity" cx="575" cy="210" r="5" fill="#C6F24C"/>
  <circle class="activity-late" cx="625" cy="210" r="5" fill="#FF7A00"/>

