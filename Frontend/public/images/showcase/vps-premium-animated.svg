      <circle cx="132" cy="151" r="6"/><circle cx="154" cy="151" r="6" opacity=".45"/><circle cx="176" cy="151" r="6" opacity=".24"/>
    </g>
    <path d="M920 136h155" stroke="#5eae84" stroke-width="5" stroke-linecap="round" opacity=".2"/>
    <path d="M1000 155h75" stroke="#5eae84" stroke-width="5" stroke-linecap="round" opacity=".2"/>
    <!-- Perspective stage and diffused grounding shadow. -->
