    <path d="M38 1074C277 951 526 1110 759 970S1002 889 1162 910" fill="none" stroke="#effff2" stroke-width="2.5" opacity=".7"/>
    <path d="M38 1118C277 995 542 1170 769 1032S1030 950 1163 963" fill="none" stroke="#75cda2" stroke-width="2" opacity=".24"/>
    <rect x="85" y="112" width="1030" height="945" fill="url(#grid)" opacity=".75" mask="none"/>
    <circle cx="714" cy="530" r="320" fill="none" stroke="#83cfa6" stroke-width="2" opacity=".36"/>
    <circle cx="714" cy="530" r="369" fill="none" stroke="#ffffff" stroke-width="2" opacity=".43" stroke-dasharray="3 20"/>
    <g class="ring-pulse"><circle cx="714" cy="530" r="268" fill="none" stroke="#ffffff" stroke-opacity=".54" stroke-width="3" stroke-dasharray="140 38 24 42"/></g>
    <!-- Micro decorations (no displayed text). -->
