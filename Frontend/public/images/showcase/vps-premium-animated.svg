<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="artTitle artDesc">
  <title id="artTitle">Premium VPS hosting illustration</title>
  <desc id="artDesc">A minimal animated isometric hosting infrastructure with a floating emerald server rack, connected cloud, secure network nodes, and subtle status lights. No visible text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fcf7"/><stop offset=".5" stop-color="#e2f5e9"/><stop offset="1" stop-color="#c7ebd6"/>
    </linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#bcf7d2" stop-opacity=".92"/><stop offset=".55" stop-color="#dbf8e4" stop-opacity=".43"/><stop offset="1" stop-color="#cdebdc" stop-opacity="0"/></radialGradient>
    <linearGradient id="rackFace" x1="0" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#115a47"/><stop offset=".52" stop-color="#074637"/><stop offset="1" stop-color="#003528"/></linearGradient>
    <linearGradient id="rackSide" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#087f59"/><stop offset=".55" stop-color="#075b44"/><stop offset="1" stop-color="#013d2c"/></linearGradient>
    <linearGradient id="rackTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#72f0aa"/><stop offset=".42" stop-color="#20b97d"/><stop offset="1" stop-color="#066a4d"/></linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#174d43"/><stop offset="1" stop-color="#062f2a"/></linearGradient>
    <linearGradient id="topGlass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fff9" stop-opacity=".94"/><stop offset="1" stop-color="#d0f6e0" stop-opacity=".73"/></linearGradient>
    <linearGradient id="plinth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#83e4ad"/><stop offset="1" stop-color="#118254"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d8ffa2"/><stop offset="1" stop-color="#5beba5"/></linearGradient>
    <linearGradient id="cloudFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b4efcd"/></linearGradient>
    <linearGradient id="thinGlass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".98"/><stop offset="1" stop-color="#d3f1e2" stop-opacity=".86"/></linearGradient>
    <filter id="softShadow" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="cardShadow" x="-45%" y="-45%" width="190%" height="190%"><feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#10563a" flood-opacity=".16"/></filter>
    <filter id="rackShadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="12" dy="28" stdDeviation="22" flood-color="#03482e" flood-opacity=".26"/></filter>
    <filter id="statusGlow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54 0H0V54" fill="none" stroke="#18825a" stroke-width="1" opacity=".085"/></pattern>
    <clipPath id="roundClip"><rect x="38" y="38" width="1124" height="1124" rx="76"/></clipPath>
  </defs>
  <style><![CDATA[
    .hover-main {animation: drift 7.2s ease-in-out infinite;transform-origin: 600px 600px;}
    .hover-cloud {animation: bob 5.8s ease-in-out infinite;transform-origin: 865px 250px;}
    .hover-card {animation: bob 6.5s ease-in-out infinite -2.5s;transform-origin: 250px 520px;}
    .hover-shield {animation: bob 6s ease-in-out infinite -1s;transform-origin: 934px 640px;}
    .ring-pulse{animation:ring 5.2s ease-in-out infinite;transform-origin:730px 555px;}
    .flow-line {stroke-dasharray:8 18;animation: march 3s linear infinite;}
    .led {animation: heartbeat 3s ease-in-out infinite;}
    .led-delay {animation-delay:-1.4s;}
    .spin-icon {animation:spin 16s linear infinite;transform-origin:948px 638px;}
    @keyframes drift {0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
    @keyframes bob {0%,100%{transform:translateY(0)}50%{transform:translateY(-17px)}}
    @keyframes ring {0%,100%{opacity:.46;transform:scale(1)}50%{opacity:.76;transform:scale(1.015)}}
    @keyframes march {to{stroke-dashoffset:-52}}
    @keyframes heartbeat {0%,100%{opacity:.68}40%{opacity:1}65%{opacity:.36}}
    @keyframes spin {to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion: reduce){.hover-main,.hover-cloud,.hover-card,.hover-shield,.ring-pulse,.flow-line,.led,.spin-icon{animation:none!important}}
  ]]></style>
  <!-- Clean framing, warm light, and fine technical grid. -->
  <rect width="1200" height="1200" fill="#f0f3ea"/>
  <rect x="38" y="38" width="1124" height="1124" rx="76" fill="url(#bg)"/>
  <g clip-path="url(#roundClip)">
