      <path d="M147 542L190 512L227 530L267 481L309 497L347 463" stroke="#00a366" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M147 560H347" stroke="#0c694c" stroke-width="2" opacity=".14"/>
