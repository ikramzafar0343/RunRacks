    </g>
    <!-- Floating performance card: abstract graphs, zero legible text. -->
    <g class="hover-card" filter="url(#cardShadow)">
      <rect x="119" y="407" width="254" height="195" rx="32" fill="url(#thinGlass)" stroke="#ffffff" stroke-width="3"/>
      <rect x="143" y="434" width="56" height="8" rx="4" fill="#086b4e" opacity=".65"/>
      <rect x="143" y="453" width="88" height="6" rx="3" fill="#2cae75" opacity=".26"/>
      <circle cx="328" cy="447" r="10" fill="#12ad6e"/>
