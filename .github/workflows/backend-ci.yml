name: Backend CI

on:
  push:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: Backend

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Line limit
        run: npm run check:lines

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + smoke tests
        run: npm test
